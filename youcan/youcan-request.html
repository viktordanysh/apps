<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOU CAN. Support</title>
    <style>
      :root { color-scheme: dark; --bg: #0e0b14; --card: #171120; --text: rgba(255,255,255,.84); --muted: rgba(255,255,255,.62); --accent: #f24e82; --line: rgba(255,255,255,.12); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, rgba(242,78,130,.18), transparent 30%), radial-gradient(circle at bottom right, rgba(86,116,255,.16), transparent 28%), var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
      main { width: min(640px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 22px; background: rgba(23,17,32,.88); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
      .eyebrow { color: var(--accent); font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 8px 0 8px; color: white; line-height: 1.05; }
      p { color: var(--muted); }
      a { color: white; }
      .email { display: inline-flex; margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.2); color: white; font-weight: 900; word-break: break-word; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">YOU CAN.</div>
      <h1>Support</h1>
      <p>Need help with reminders, AI chat, privacy, or app setup? Contact us directly and include your device model, iOS version, and a short description of what happened.</p>
      <a class="email" href="mailto:victor.danyschuk@gmail.com?subject=YOU%20CAN.%20Support">victor.danyschuk@gmail.com</a>
    </main>
  </body>
</html>
